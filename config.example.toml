# loratrix example configuration.
#
# Copy to ~/.config/loratrix/config.toml and edit. Unknown keys are rejected, so
# a typo fails at startup instead of being silently ignored.

[matrix]
homeserver = "https://matrix.example.org"
# Full user id of the relay account.
user_id = "@relay:example.org"
# Prefer a file over an inline token so the secret is not in this file. The
# file must contain the token and nothing else.
access_token_file = "~/.config/loratrix/token"
#access_token = "syt_..."

# Optional. Every value below is a default.
#[relay]
# How long a relayed message is remembered, to drop duplicates and the relay's
# own echo coming back off another mesh.
#dedupe_window_secs = 30
# How long the relay remembers which mesh message a Matrix event is, so that a
# reply written in Matrix goes out as a reply rather than as a loose remark.
# Answering something older than this still works; it just arrives unthreaded.
#reply_window_secs = 43200
# Prefix templates. Placeholders:
#
#   {name}         best name there is, and the only one never left blank:
#                  the long name, else the short one, else unknown_sender_name
#   {long}         the sender's long name, empty if the protocol gave none
#   {short}        the sender's short name — Meshtastic only; MeshCore has none
#   {network}      the name given to the network in [[networks]]
#   {network_tag}  "[network]" in a DM inbox listening to more than one, else ""
#   {channel}      channel index, empty for a direct message
#
# A trailing number caps a value in bytes, so {name5} is at most five bytes and
# {short2} at most two.
#
# Every direction has a general template and a per-protocol override. Where an
# override is set it wins; otherwise the general one applies. That is what makes
# {short} usable: it exists on Meshtastic and not on MeshCore, so the template
# that asks for it should only be the Meshtastic one.
#mesh_to_matrix_prefix = "[{name}/{network}]: "
#meshtastic_to_matrix_prefix = "[{short}/{long}]: "
#meshcore_to_matrix_prefix = "[{name}/{network}]: "

#matrix_to_mesh_prefix = "{name5}[M]: "
#matrix_to_meshtastic_prefix = "{name5}[M]: "
#matrix_to_meshcore_prefix = "{name}: "

# Used when a room has more than one route and a message is fanned out to the
# other mesh. Named for where it is going, since that is whose payload it spends.
#mesh_to_mesh_prefix = "{name5}[{network4}]: "
#meshtastic_to_meshcore_prefix = "{name}: "
#meshcore_to_meshtastic_prefix = "{name5}[{network4}]: "

#dm_prefix = "[DM]{network_tag} {name}: "
#meshtastic_dm_prefix = "[DM]{network_tag} {short}: "
#meshcore_dm_prefix = "[DM]{network_tag} {name}: "

# And on the way back: reply to a direct message in its inbox room and the answer
# is sent to whoever wrote it. The prefix says which person in the room answered,
# which the node at the other end has no other way of knowing.
#matrix_to_dm_prefix = "{name5}[M]: "
#matrix_to_meshtastic_dm_prefix = "{short}[M]: "
#matrix_to_meshcore_dm_prefix = "{name}: "

# Shown instead of a name when the protocol does not carry one and none could be
# read out of the text. See the note on MeshCore channels in the README.
#unknown_sender_name = "unknown"

# One entry per radio. The name is how rooms refer to it, and it appears in
# prefixes, so keep it short.
[[networks]]
name = "lora"
kind = "meshtastic"
transport = { type = "tcp", host = "192.168.1.41" }   # port defaults to 4403

[[networks]]
name = "mc"
kind = "meshcore"
transport = { type = "tcp", host = "192.168.1.161" }  # port defaults to 5000

# Other transports:
#transport = { type = "serial", port = "/dev/ttyACM0" }   # baud defaults to 115200
#transport = { type = "ble", address = "AA:BB:CC:DD:EE:FF" }  # needs the `ble` feature

# A room with one route is a plain 1:1 bridge between a Matrix room and a mesh
# channel.
[[rooms]]
id = "!general:example.org"
routes = [{ network = "lora", channel = 0 }]

# A room with several routes also bridges those meshes to each other: a message
# on lora channel 1 reaches both Matrix and mc channel 1.
[[rooms]]
id = "!bridge:example.org"
routes = [
  { network = "lora", channel = 1 },
  { network = "mc", channel = 1 },
]

# A DM inbox mirrors direct messages sent to the relay's own node. It is
# read-only: you see them, but nothing written in the room goes back to the
# mesh. Give it a single network or a list; with a list, each message is tagged
# with the network it came from.
[[rooms]]
id = "!dm:example.org"
dm_inbox = ["lora", "mc"]
